<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan admin dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><div><strong>Loan Administration</strong><small>Restricted staff access</small></div><a class="button" href="index.html">Client portal</a></header><main class="wrap"><section class="panel"><div class="topline"><div><h1>Applications</h1><p class="muted">Only authorized administrator accounts can view client records.</p></div><button id="logout" class="secondary hidden">Sign out</button></div><div id="adminAuth"><div class="grid"><div class="field"><label for="adminEmail">Admin email</label><input id="adminEmail" type="email"></div><div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password"></div></div><div class="actions"><button id="login">Sign in</button></div></div><p id="message" role="status"></p><div id="dashboard" class="hidden"><div class="topline"><h2>Submitted applications</h2><button id="reload" class="secondary">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Applicant</th><th>Phone</th><th>Loan</th><th>Mobile money</th><th>Status</th><th>Documents</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script src="admin.js"></script></body></html>
